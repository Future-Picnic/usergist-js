name: Coordinate private SDK PR checks
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Optional private PR number (empty checks all open PRs)
        required: false
        type: string
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
concurrency:
  group: sdk-pr-bridge
  cancel-in-progress: false
jobs:
  coordinate:
    if: github.repository == 'Future-Picnic/usergist-js' && github.ref == 'refs/heads/main' && vars.SDK_PR_BRIDGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sdk-ci-controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: Future-Picnic
          repositories: usergist,usergist-js,usergist-ios,usergist-android,usergist-flutter
          permission-contents: write
          permission-pull-requests: read
          permission-actions: write
          permission-statuses: write
      - name: Mirror SDK snapshots and reconcile exact-commit results
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          args=()
          if [[ -n "$PR_NUMBER" ]]; then args=(--pr "$PR_NUMBER"); fi
          node tools/sdk-ci/bridge.mjs "${args[@]}"
